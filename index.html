<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- import Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo">Header Logo</div>

        <ul class="header-links">
            <li><a href="#">header link one</a></li>
            <li><a href="#">header link two</a></li>
            <li><a href="#">header link three</a></li>
        </ul>
    </div>

    <!-- HERO SECTION -->
    <div class="hero">
        <div class="hero-left">
            <h1 class="main-text">This website is awesome</h1>
            <p class="secondary-text">This website has some subtext that goes here under the main title.It's a smaller font and the color is lower contrast</p>
            <button class="signup-btn">Sign up</button>
        </div>

        <div class="hero-right">
            <img src="https://via.placeholder.com/500x300" alt="this is a placeholder for an image">
        </div>
    </div>

</body>
</html>
